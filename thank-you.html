<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Richiesta inviata — IdeaForge</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:
        radial-gradient(circle at 20% 18%, rgba(47,111,213,.26), transparent 34%),
        radial-gradient(circle at 85% 80%, rgba(84,220,155,.16), transparent 32%),
        linear-gradient(180deg,#050711,#0b0e18);
      color:#f5f5f7;
    }
    main{
      width:min(100%,680px);
      padding:42px;
      border-radius:36px;
      background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.045));
      border:1px solid rgba(255,255,255,.14);
      box-shadow:0 34px 80px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
      text-align:center;
    }
    .check{
      width:92px;
      height:92px;
      margin:0 auto 24px;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:linear-gradient(180deg,#35E86E,#09B84F);
      box-shadow:0 0 50px rgba(16,220,90,.22), inset 0 1px 0 rgba(255,255,255,.36);
    }
    .check svg{width:52px;height:52px;color:#fff;stroke-width:4.8}
    h1{margin:0 0 12px;font-size:clamp(40px,8vw,70px);line-height:.95;letter-spacing:-.055em}
    p{margin:0;color:#aeb7ca;font-size:18px;line-height:1.45;font-weight:650}
    a{
      margin-top:30px;
      display:inline-flex;
      min-height:52px;
      align-items:center;
      justify-content:center;
      padding:0 22px;
      border-radius:999px;
      background:linear-gradient(180deg,#4184f4,#2f6fd5);
      color:#fff;
      text-decoration:none;
      font-weight:820;
      letter-spacing:-.02em;
    }
  </style>
</head>
<body>
  <main>
    <div class="check" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M5 12.5l4.2 4.2L19.5 6.5" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Riepilogo inviato.</h1>
    <p>La richiesta è stata ricevuta. Il report verrà preparato e inviato tramite il contatto indicato.</p>
    <a href="./">Torna a IdeaForge</a>
  </main>
</body>
</html>
